<!-- Capa foreground del adaptive icon. Fondo transparente.

     La escala 1.34 compensa el inset del generador: flutter_launcher_icons envuelve
     este drawable en <inset android:inset="16%"> dentro de ic_launcher.xml, así que
     el dibujo solo ocupa el 68% del lienzo de 108 dp. Cadena completa:
       306/512 (0.598) × 1.34 × 0.68 × 108 dp = 58.8 dp de diámetro final,
     holgado dentro de la zona segura de 66 dp y del área visible de 72 dp.
     Si se cambia la versión del generador, verificar que el inset siga siendo 16%. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="ProsodIA">
  <g transform="translate(256,256) scale(1.34) translate(-256,-256)">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="26" opacity="0.30"/>
    <circle cx="256" cy="256" r="140" fill="none" stroke="#F97316" stroke-width="26" stroke-linecap="round"
            stroke-dasharray="612 268" transform="rotate(-90 256 256)"/>
    <path d="M 176 268 C 204 268 204 208 232 208 C 260 208 260 304 288 304 C 316 304 316 240 340 240"
          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
