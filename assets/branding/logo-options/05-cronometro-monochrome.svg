<!-- Capa monochrome (iconos temáticos de Android 13+). El sistema descarta el color
     y tiñe la silueta según el papel mural, así que la forma la define el alfa.

     Cambio deliberado respecto al foreground: se elimina el aro de fondo al 30%.
     En monocromo ese aro y el arco naranja colapsan al mismo tono y el resultado es
     un círculo sólido — se pierde la lectura de medidor. Dejando solo el arco de
     progreso, el gesto de cronómetro sobrevive con un único color.

     Escala 1.34 por la misma razón que el foreground: compensa el inset del 16% que
     el generador aplica en ic_launcher.xml. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="ProsodIA">
  <g transform="translate(256,256) scale(1.34) translate(-256,-256)">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"
            stroke-dasharray="612 268" transform="rotate(-90 256 256)"/>
    <path d="M 176 268 C 204 268 204 208 232 208 C 260 208 260 304 288 304 C 316 304 316 240 340 240"
          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
